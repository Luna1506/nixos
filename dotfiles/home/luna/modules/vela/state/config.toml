# vela configuration. Edited by the settings window (`vela settings`);
# manual edits are picked up live. See README.md for every option.
[general]
width = 760
max_height = 580
vertical_position = 18
horizontal_position = "center"
side_margin = 48
clock = false
clock_size = 128
clock_font = ""
opacity = 0.86
close_on_focus_loss = true
main_monitor = ""
max_results = 20
systemd_scope = true

[appearance]
theme = "dark"
accent = "#7aa2f7"
tile_size = 108
icon_size = 52
spacing = 8
columns = 0
border_radius = 22
surface_opacity = 0.06
show_labels = true
tile_outline = false
tile_background = true
font_scale = 1.0
animations = true
animation_speed = 1.0
backdrop = false
backdrop_dim = 0.18
backdrop_strength = 1
backdrop_blur = true

[apps]
grid = "pinned"
pinned = [
    "zen.desktop",
    "vesktop.desktop",
    "spotify.desktop",
    "steam.desktop",
    "jetbrains-toolbox.desktop",
]
hidden = []
desktop_actions = true
custom = []

[search]
apps = true
files = true
claude = true
max_app_results = 8
max_file_results = 10
file_backend = "auto"
file_roots = ["~"]
exclude = [
    ".git",
    "node_modules",
    "target",
    ".cache",
    "__pycache__",
    ".venv",
    "venv",
    ".gradle",
    ".m2",
    ".cargo",
    ".rustup",
    ".npm",
]
include_hidden = false
include_directories = true
min_file_query_len = 2
debounce_ms = 80
index_interval_minutes = 30

[claude]
always_visible = true
shift_enter = true
prefer_for_questions = true
executable = "claude"
args = ["--dangerously-skip-permissions"]
working_dir = "~"

[terminal]
executable = "ghostty"

[panel]
width = 420
close_on_focus_loss = true
backdrop = true
backdrop_strength = 1
backdrop_blur = false
popup_timeout_secs = 5
popup_max_visible = 4
critical_popups_stay = true
group_collapsed_count = 2
compact_notifications = true
workspace_osd = true
night_light_temperature = 4000
clock_centered = true
clock_on_backdrop = false
clock_font = ""
backdrop_clock_size = 128
media_player = true
media_player_any = false
media_player_position = "tiles"
media_player_cover = true
media_player_cover_background = true
media_player_progress = true
media_player_shuffle_repeat = true
media_player_scale = 1.0
media_player_cover_blur = 0.75
media_player_button_scale = 1.0
media_player_button_background = false
claude_usage = true
claude_usage_subtle = false
claude_usage_only_default = false
claude_usage_hidden = []
updates_tile = true

[idle]
dim = true
dim_after_min = 2.5
lock = true
lock_after_min = 5.0
screen_off = true
screen_off_after_min = 5.5
suspend = true
suspend_after_min = 30.0
lock_before_sleep = true

[updates]
check_interval_hours = 6
aur = true
flatpak = true
claude_workspace = "special:minimized"

[self_update]
check_interval_hours = 12
notify = true
